<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>G ONE WEB - نيوز پورٽل</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #2563eb;
      --accent: #ef4444;
      --border-color: #e2e8f0;
      --header-bg: #1e293b;
    }

    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --border-color: #334155;
      --header-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 75px; transition: background-color 0.3s, color 0.3s; }

    .app-header { position: sticky; top: 0; z-index: 100; background: var(--header-bg); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-size: 20px; font-weight: 800; color: #38bdf8; text-decoration: none; }
    .theme-toggle-btn { background: #334155; border: none; color: #f8fafc; padding: 6px 10px; border-radius: 20px; cursor: pointer; }

    .app-nav { background: var(--header-bg); display: flex; overflow-x: auto; padding: 0 8px 8px 8px; border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
    .app-nav::-webkit-scrollbar { display: none; }
    .app-nav button { background: transparent; border: none; color: #94a3b8; padding: 8px 14px; font-size: 14px; font-weight: 600; border-radius: 20px; margin-left: 6px; cursor: pointer; }
    .app-nav button.active { background: #38bdf8; color: #0f172a; }

    .news-ticker-container { background: var(--accent); color: white; display: flex; align-items: center; overflow: hidden; font-size: 13px; font-weight: bold; }
    .ticker-title { background: #b91c1c; padding: 6px 12px; white-space: nowrap; z-index: 2; }
    .ticker-marquee { white-space: nowrap; overflow: hidden; width: 100%; }
    .ticker-text { display: inline-block; padding-left: 100%; animation: marquee 45s linear infinite; }
    @keyframes marquee { 0% { transform: translate(-100%, 0); } 100% { transform: translate(100%, 0); } }

    .app-container { max-width: 600px; margin: 0 auto; padding: 12px; }
    .section-title { font-size: 16px; font-weight: bold; margin: 15px 0 10px 0; display: flex; align-items: center; color: var(--text-main); }
    .section-title::after { content: ''; flex: 1; height: 2px; background: var(--border-color); margin-right: 10px; }

    /* Video Embed Box Frame */
    .embed-video-wrapper {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-bottom: 8px;
    }
    .embed-video-wrapper iframe {
      width: 100% !important;
      min-height: 320px;
      border: none;
      display: block;
    }

    /* Scrollable News Container */
    .news-scroll-box { max-height: 480px; overflow-y: auto; padding-left: 4px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; }
    .news-scroll-box::-webkit-scrollbar { width: 5px; }
    .news-scroll-box::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    .feed-card { display: flex; gap: 12px; background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; align-items: center; cursor: pointer; }
    .feed-img { width: 85px; height: 85px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #cbd5e1; }
    .feed-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 85px; }
    .feed-title { font-size: 14px; font-weight: 600; color: var(--text-main); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .feed-meta { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; position: relative; }
    .modal-close { position: absolute; top: 15px; left: 15px; background: #ef4444; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); background: none; border: none; font-size: 11px; cursor: pointer; }
    .bottom-nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="#" onclick="switchCategory('all')" class="brand-logo">G ONE WEB</a>
    <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌙</button>
  </header>

  <nav class="app-nav">
    <button class="nav-tab active" id="tab-all" onclick="switchCategory('all')">🏠 هوم</button>
    <button class="nav-tab" id="tab-local" onclick="switchCategory('local')">📍 لوڪل خبرون</button>
    <button class="nav-tab" id="tab-science" onclick="switchCategory('science')">🧬 سائنس</button>
    <button class="nav-tab" id="tab-international" onclick="switchCategory('international')">🌍 انٽرنيشنل</button>
  </nav>

  <div class="news-ticker-container">
    <div class="ticker-title">خاص خبر</div>
    <div class="ticker-marquee">
      <div class="ticker-text" id="top-slider">لوڊ ٿي رهيو آهي...</div>
    </div>
  </div>

  <div class="app-container">
    <div id="first-featured-news"></div>

    <div class="section-title"><span id="feed-category-title">📰 تازيون خبرون</span></div>
    <div class="news-scroll-box" id="secondary-news"></div>
  </div>

  <div class="bottom-nav">
    <button class="bottom-nav-item active" onclick="switchCategory('all')">🏠<span> هوم</span></button>
    <button class="bottom-nav-item" onclick="switchCategory('local')">📍<span> لوڪل</span></button>
    <button class="bottom-nav-item" onclick="switchCategory('science')">🧬<span> سائنس</span></button>
  </div>

  <div class="modal-overlay" id="newsModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeNewsModal()">✕</button>
      <h2 id="mTitle" style="font-size: 18px; margin-bottom: 10px;"></h2>
      <div id="mVideoBox"></div>
      <img id="mImg" src="" style="width:100%; border-radius:8px; display:none; margin-bottom:10px;">
      <p id="mContent" style="font-size:14px; line-height:1.7; color:var(--text-sub); white-space:pre-line;"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let globalNewsArray = [];

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    async function loadPageData() {
      const { data: sliderData } = await _supabase.from('news').select('title').eq('is_trending', true).order('created_at', { ascending: false });
      if(sliderData && sliderData.length > 0) {
        document.getElementById('top-slider').innerText = sliderData.map(n => n.title).join('  ||  ');
      }

      const { data: allNews } = await _supabase.from('news').select('*').order('created_at', { ascending: false });
      if(allNews && allNews.length > 0) {
        globalNewsArray = allNews;
        renderNewsFeed();
      }
    }

    function renderNewsFeed() {
      if(globalNewsArray.length === 0) return;

      const first = globalNewsArray[0];
      let mediaHtml = '';

      // Check Video vs Image
      if(first.video_code) {
        mediaHtml = `<div class="embed-video-wrapper">${first.video_code}</div>`;
      } else if(first.image_url && first.image_url !== 'null') {
        mediaHtml = `<img src="${first.image_url}" style="width:100%; height:210px; object-fit:cover;">`;
      }

      document.getElementById('first-featured-news').innerHTML = `
        <div class="feed-card" style="flex-direction:column; align-items:flex-start;" onclick="openNewsModal('${first.id}')">
          ${mediaHtml}
          <div style="padding:5px;">
            <h2 style="font-size:16px; margin-bottom:5px;">${first.title}</h2>
            <p style="font-size:13px; color:var(--text-sub);">${first.content}</p>
          </div>
        </div>
      `;

      const secondary = globalNewsArray.slice(1);
      document.getElementById('secondary-news').innerHTML = secondary.map(n => {
        let thumbHtml = `<div class="feed-img" style="display:flex;align-items:center;justify-content:center;">📰</div>`;
        if(n.video_code) {
          thumbHtml = `<div class="feed-img" style="display:flex;align-items:center;justify-content:center;background:#1e293b;color:#38bdf8;font-size:20px;">🎥</div>`;
        } else if(n.image_url && n.image_url !== 'null') {
          thumbHtml = `<img src="${n.image_url}" class="feed-img">`;
        }

        return `
          <div class="feed-card" onclick="openNewsModal('${n.id}')">
            ${thumbHtml}
            <div class="feed-details">
              <div class="feed-title">${n.title}</div>
              <div class="feed-meta"><span>${new Date(n.created_at).toLocaleDateString('sd-PK')}</span></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openNewsModal(newsId) {
      const item = globalNewsArray.find(n => n.id == newsId);
      if(!item) return;

      document.getElementById('mTitle').innerText = item.title;
      document.getElementById('mContent').innerText = item.content;

      const vBox = document.getElementById('mVideoBox');
      const imgElem = document.getElementById('mImg');

      if(item.video_code) {
        vBox.innerHTML = `<div class="embed-video-wrapper">${item.video_code}</div>`;
        imgElem.style.display = 'none';
      } else {
        vBox.innerHTML = '';
        if(item.image_url && item.image_url !== 'null') {
          imgElem.src = item.image_url;
          imgElem.style.display = 'block';
        } else {
          imgElem.style.display = 'none';
        }
      }

      document.getElementById('newsModal').style.display = 'flex';
    }

    function closeNewsModal() { document.getElementById('newsModal').style.display = 'none'; }
    loadPageData();
  </script>
</body>
</html>
